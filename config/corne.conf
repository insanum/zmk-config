
CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

CONFIG_ZMK_KEYBOARD_NAME="ZMK Corne 36"

# =============================================================================
# ZMK Power Management Reference
# =============================================================================
#
# Power States (in order):
#   Active → Idle → Deep Sleep
#
# CONFIG_ZMK_IDLE_TIMEOUT (default: 30000ms = 30 sec)
#   Time of inactivity before entering idle mode.
#   In idle: CPU low-power, Bluetooth stays connected, instant wake.
#   Example: CONFIG_ZMK_IDLE_TIMEOUT=600000 (10 minutes)
#
# CONFIG_ZMK_SLEEP (default: n)
#   Master toggle for deep sleep. Set to 'y' to enable, 'n' to disable.
#   If disabled, keyboard stays in idle forever (never disconnects).
#
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT (default: 900000ms = 15 min)
#   Time spent IN IDLE before entering deep sleep.
#   Total time to deep sleep = IDLE_TIMEOUT + IDLE_SLEEP_TIMEOUT
#   In deep sleep: Bluetooth disconnects, must press key on each half to wake.
#   Example: CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000 (1 hour)
#
# Battery/Convenience Trade-offs (with 1000mAh per side, OLED, no RGB):
#   - Deep sleep enabled, short timeouts: ~4% per day, reconnection hassle
#   - Deep sleep disabled: ~15-20% per day, always connected, instant wake
#   - Longer IDLE_SLEEP_TIMEOUT: middle ground
#
# =============================================================================

# Deep sleep disabled - keyboard stays connected, just enters low-power idle.
# Trade-off: more battery usage (~15-20%/day) but no reconnection hassle.
CONFIG_ZMK_SLEEP=n

# Enter idle mode after 10 minutes of inactivity.
# In idle: low power but Bluetooth stays connected, any key wakes instantly.
CONFIG_ZMK_IDLE_TIMEOUT=600000

